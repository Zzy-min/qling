name: release-portable

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        default: v1.4.0

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci
      - name: Validate tag and build portable package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag and package version differ' }
          npm run build:portable-win
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate release packaging
        run: npm run validate:packaging:release
      - name: Upload verified portable assets to existing draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $release = gh release view $env:RELEASE_TAG --json isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.isDraft -ne $true) { throw 'An existing draft release is required' }
          gh release upload $env:RELEASE_TAG dist-portable/qling-win-x64.zip dist-portable/portable-meta.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
